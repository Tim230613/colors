<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Color Memory</title>
    <link rel="stylesheet" href="styles.css?v=13">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="mode-selection" id="modeSelection" hidden>
        <div class="topbar">
          <div>
            <p class="eyebrow">Color Memory</p>
            <h1>Выбери режим</h1>
          </div>
        </div>
        <div class="mode-buttons">
          <button id="soloModeButton" class="mode-button">
            <span class="mode-icon">👤</span>
            <span class="mode-title">Играть</span>
            <span class="mode-desc">Тренируй память в одиночку</span>
          </button>
          <button id="multiplayerModeButton" class="mode-button">
            <span class="mode-icon">👥</span>
            <span class="mode-title">Играть с другом</span>
            <span class="mode-desc">Соревнуйся с друзьями</span>
          </button>
        </div>
      </section>

      <section class="invite-screen" id="inviteScreen" hidden>
        <div class="topbar">
          <div>
            <p class="eyebrow">Color Memory</p>
            <h1>Пригласи друга</h1>
          </div>
        </div>
        <div class="invite-content">
          <p class="invite-text" id="inviteText">Отправь эту ссылку другу:</p>
          <div class="invite-link-container" id="linkContainer">
            <input id="inviteLink" type="text" readonly class="invite-link">
            <button id="copyButton" class="copy-button">Копировать</button>
          </div>
          <div id="telegramButton" style="display: none; margin-top: 20px;">
            <p style="text-align: center; margin-bottom: 10px;">Нажми на кнопку ниже в боте:</p>
          </div>
          <p class="waiting-text" id="waitingText">Ожидание второго игрока...</p>
        </div>
      </section>

      <section class="game" id="gameSection" hidden>
        <div class="topbar">
          <div>
            <p class="eyebrow">Color Memory</p>
            <h1>Запомни цвет</h1>
          </div>
          <div class="timer" id="timer">3</div>
        </div>

        <div class="color-stage" id="targetColor">
          <span id="stageLabel">Смотри внимательно</span>
        </div>

        <div class="controls" id="controls" hidden>
          <label class="slider-row">
            <span>Оттенок</span>
            <input id="hueSlider" type="range" min="0" max="360" value="180">
          </label>

          <label class="slider-row">
            <span>Яркость</span>
            <input id="lightnessSlider" type="range" min="0" max="80" value="0">
          </label>

          <div class="preview-row">
            <div>
              <p class="small-label">Твой выбор</p>
              <div class="guess-preview" id="guessPreview"></div>
            </div>
            <button id="submitButton" type="button">Готово</button>
          </div>
        </div>

        <div class="result" id="result" hidden>
          <p class="small-label">Результат</p>
          <h2 id="scoreText">0%</h2>
          <p id="resultText"></p>
          <div class="result-actions">
            <button id="againButton" type="button">Дальше</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js?v=15" defer></script>
  </body>
</html>
