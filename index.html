<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Color Memory</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="game">
        <div class="topbar">
          <div>
            <p class="eyebrow">Color Memory</p>
            <h1>Запомни цвет</h1>
          </div>
          <div class="timer" id="timer">3</div>
        </div>

        <div class="color-stage" id="targetColor">
          <span id="stageLabel">Смотри внимательно</span>
        </div>

        <div class="controls" id="controls" hidden>
          <label class="slider-row">
            <span>Оттенок</span>
            <input id="hueSlider" type="range" min="0" max="360" value="180">
          </label>

          <label class="slider-row">
            <span>Яркость</span>
            <input id="lightnessSlider" type="range" min="0" max="80" value="0">
          </label>

          <div class="preview-row">
            <div>
              <p class="small-label">Твой выбор</p>
              <div class="guess-preview" id="guessPreview"></div>
            </div>
            <button id="submitButton" type="button">Готово</button>
          </div>
        </div>

        <div class="result" id="result" hidden>
          <p class="small-label">Результат</p>
          <h2 id="scoreText">0%</h2>
          <p id="resultText"></p>
          <div class="result-actions">
            <button id="againButton" type="button">Дальше</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
